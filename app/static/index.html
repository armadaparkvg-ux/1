<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Армада — ИИ поддержка водителей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #0b1220;
      --bg1: #122033;
      --ink: #eef3ff;
      --muted: #9aabbf;
      --accent: #ff6a3d;
      --accent2: #2dd4bf;
      --line: rgba(255,255,255,.08);
      --bubble: rgba(255,255,255,.06);
      --bubble-user: rgba(255,106,61,.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Manrope, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(255,106,61,.25), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(45,212,191,.18), transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 16px 40px;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
    }
    header h1 {
      font-family: Unbounded, sans-serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      margin: 0 0 6px;
      letter-spacing: -.02em;
    }
    header p { margin: 0; color: var(--muted); max-width: 52ch; line-height: 1.45; }
    .meta { margin-top: 10px; font-size: .85rem; color: var(--muted); }
    .meta strong { color: var(--accent2); font-weight: 600; }
    .chat {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(8,14,24,.55);
      backdrop-filter: blur(10px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 52vh;
    }
    .msgs {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: min(78%, 560px);
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      background: var(--bubble);
      border: 1px solid var(--line);
    }
    .msg.user { align-self: flex-end; background: var(--bubble-user); }
    .msg.bot { align-self: flex-start; }
    .msg .tag {
      display: block;
      font-size: .72rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--line);
    }
    input, button, select {
      font: inherit;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--ink);
      padding: 12px 14px;
    }
    button {
      background: linear-gradient(135deg, var(--accent), #ff8f4a);
      border: none;
      color: #1a0d08;
      font-weight: 700;
      cursor: pointer;
      min-width: 110px;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .hints { display: flex; flex-wrap: wrap; gap: 8px; }
    .hints button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      font-weight: 600;
      font-size: .85rem;
      min-width: 0;
      padding: 8px 12px;
    }
    .hints button:hover { color: var(--ink); border-color: rgba(255,255,255,.2); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Армада · ИИ-поддержка</h1>
      <p>Агент службы поддержки водителей: отвечает как менеджер парка по базе знаний, сайту и стилю диалогов.</p>
      <div class="meta">Режим: <strong id="provider">…</strong> · интентов: <strong id="intents">…</strong></div>
    </header>

    <div class="chat">
      <div class="msgs" id="msgs"></div>
      <div class="hints" style="padding:0 14px 10px">
        <button type="button" data-q="Здравствуйте">Приветствие</button>
        <button type="button" data-q="Как подключить Яндекс такси?">Подключение</button>
        <button type="button" data-q="Как вывести деньги?">Вывод</button>
        <button type="button" data-q="Нужна лицензия ФГИС">ФГИС</button>
        <button type="button" data-q="ОСГОП делаете?">ОСГОП</button>
        <button type="button" data-q="Хочу курьером в доставку">Доставка</button>
      </div>
      <form id="form">
        <input id="input" autocomplete="off" placeholder="Напишите вопрос водителя…" />
        <button type="submit" id="send">Отправить</button>
      </form>
    </div>
  </div>
  <script>
    const msgs = document.getElementById('msgs');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    let sessionId = localStorage.getItem('armada_sid') || null;

    function add(role, text, tag) {
      const el = document.createElement('div');
      el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
      if (tag) {
        const t = document.createElement('span');
        t.className = 'tag';
        t.textContent = tag;
        el.appendChild(t);
      }
      el.appendChild(document.createTextNode(text));
      msgs.appendChild(el);
      msgs.scrollTop = msgs.scrollHeight;
    }

    async function boot() {
      try {
        const h = await fetch('/health').then(r => r.json());
        document.getElementById('provider').textContent = h.provider + (h.llm_enabled ? '' : ' (без API — шаблоны менеджера)');
        document.getElementById('intents').textContent = h.intents;
        add('bot', 'Здравствуйте! Парк «АРМАДА» на связи. Спросите про подключение, вывод, ФГИС или доставку.');
      } catch (e) {
        add('bot', 'Сервер не ответил на /health');
      }
    }

    async function ask(text) {
      add('user', text);
      send.disabled = true;
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: sessionId, channel: 'web' })
        }).then(r => r.json());
        sessionId = res.session_id;
        localStorage.setItem('armada_sid', sessionId);
        const tag = [res.mode, res.intent_id, res.confidence != null ? ('score ' + res.confidence) : '']
          .filter(Boolean).join(' · ');
        add('bot', res.reply, tag);
      } catch (e) {
        add('bot', 'Ошибка запроса: ' + e);
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      ask(text);
    });
    document.querySelectorAll('.hints button').forEach(btn => {
      btn.addEventListener('click', () => ask(btn.dataset.q));
    });
    boot();
  </script>
</body>
</html>
