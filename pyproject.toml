[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-publisher"
version = "0.1.0"
description = "Мультиплатформенная публикация видео таксопарка (VK, YouTube Shorts, Instagram Reels, TikTok)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Taxi Fleet Content Team" }]
dependencies = [
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "google-api-python-client>=2.130.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "APScheduler>=3.10.4",
    "SQLAlchemy>=2.0.30",
    "click>=8.1.7",
    "tenacity>=8.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.1",
]

[project.scripts]
video-publisher = "video_publisher.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["video_publisher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
